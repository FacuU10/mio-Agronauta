version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: monorepo-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/bootstrap/agronautas:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d appdb && psql -U user -d appdb -tAc 'SELECT PostGIS_Version()' | grep -q ."]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: monorepo-mongodb
    environment:
      MONGO_INITDB_DATABASE: appdb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    profiles: ["optional"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: monorepo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: monorepo-api
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://user:password@postgres:5432/appdb"
      MONGODB_URL: "mongodb://mongodb:27017/appdb"
      REDIS_URL: "redis://redis:6379"
      API_PORT: 3001
      NODE_ENV: production
      CORS_ORIGINS: "http://localhost:3000"
      AGRONAUTAS_ROUTE_PREFIX: "/agronautas"
      AGRONAUTAS_RUNTIME_MODE: "real"
      READINESS_OPTIONAL_SERVICES: "mongodb"
      AGRONAUTAS_RUNTIME_REQUIRED: "true"
      AGRONAUTAS_WORKER_HEARTBEAT_MAX_AGE_SECONDS: 180
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/workflow-runtime-python/Dockerfile
    container_name: monorepo-worker
    environment:
      WORKER_POSTGRES_DSN: "postgresql://user:password@postgres:5432/appdb"
      WORKER_REDIS_URL: "redis://redis:6379/0"
      WORKER_CONTRACTS_ROOT: "/app/packages/contracts/schemas"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, psycopg; from redis import Redis; connection = psycopg.connect(os.environ['WORKER_POSTGRES_DSN'], connect_timeout=3); connection.close(); redis = Redis.from_url(os.environ['WORKER_REDIS_URL'], socket_connect_timeout=3); assert redis.ping(); redis.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
