services:
  - type: web
    runtime: node
    name: agronautas-api
    # Render probes liveness here. Readiness remains an operator/release gate at /ready.
    healthCheckPath: /health
    buildCommand: pnpm install --frozen-lockfile && pnpm --dir packages/zod-schemas build && pnpm --dir packages/hydrology-engine build && pnpm --dir apps/api build
    startCommand: pnpm --dir apps/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
      - key: API_PORT
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: RENDER
        value: "true"
      - key: AGRONAUTAS_AUTH_ENABLED
        value: "true"
      - key: AGRONAUTAS_RUNTIME_REQUIRED
        value: "true"
      - key: AGRONAUTAS_RUNTIME_MODE
        value: real
      - key: AGRONAUTAS_ROUTE_PREFIX
        value: /agronautas
      - key: AGRONAUTAS_READINESS_DEPENDENCY_TIMEOUT_MS
        value: "5000"
      - key: AGRONAUTAS_WORKER_HEARTBEAT_MAX_AGE_SECONDS
        value: "180"
      - key: READINESS_OPTIONAL_SERVICES
        value: none
      - key: AGRONAUTAS_FORCE_ENV_VALIDATION
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: HYDROLOGY_INGEST_TOKEN
        sync: false
      - key: HYDROLOGY_SCHEDULER_ENABLED
        value: false
      - key: AGRONAUTAS_SCHEDULER_ENABLED
        value: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GROQ_TIMEOUT_MS
        value: "15000"
      - key: NASA_FIRMS_API_KEY
        sync: false
      - key: SENTINEL_CLIENT_ID
        sync: false
      - key: SENTINEL_CLIENT_SECRET
        sync: false

  - type: worker
    runtime: python
    name: agronautas-runtime-worker
    buildCommand: pip install ./apps/workflow-runtime-python
    startCommand: workflow-runtime-consumer
    envVars:
      - key: REDIS_URL
        sync: false
      - key: WORKER_POSTGRES_DSN
        sync: false
      - key: WORKER_CONTRACTS_ROOT
        sync: false

  - type: cron
    runtime: node
    name: ibera-hydrology-cron
    schedule: "0 * * * *"
    buildCommand: pnpm install --frozen-lockfile && pnpm --dir packages/zod-schemas build && pnpm --dir packages/hydrology-engine build && pnpm --dir apps/api build
    # AUTHORITATIVE CONTRACT: Render invokes the existing direct scheduler:once entrypoint.
    # Authentication is the named runtime secret plus fixed owner boundary; no HTTP POST or HTTP token/header is used.
    # A process exit is not completion proof; retain the Render execution record and redacted receipt.
    startCommand: pnpm --dir apps/api scheduler:once -- --render-cron
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: HYDROLOGY_INGEST_TOKEN
        sync: false
      - key: HYDROLOGY_CRON_OWNER_ID
        value: ibera-hydrology-cron

  - type: web
    runtime: node
    name: agronautas-web
    healthCheckPath: /
    buildCommand: pnpm install --frozen-lockfile && pnpm --dir apps/web build
    startCommand: pnpm --dir apps/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
      - key: AGRONAUTAS_API_INTERNAL_URL
        sync: false
      - key: AGRONAUTAS_BFF_BEARER_TOKEN
        sync: false
      - key: AGRONAUTAS_BFF_TIMEOUT_MS
        value: "60000"
